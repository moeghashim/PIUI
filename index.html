<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>PIUI</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0d12;color:#f4f6fb;font:16px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
        <section style="width:min(560px,100%);padding:32px;border:1px solid #2a2f3a;border-radius:20px;background:#11141b;box-shadow:0 24px 80px #0008">
          <p style="margin:0 0 8px;color:#9aa4b5;font-size:13px;letter-spacing:.12em;text-transform:uppercase">PIUI</p>
          <h1 style="margin:0 0 12px;font-size:28px">Start the local server first</h1>
          <p style="margin:0 0 18px;color:#b8c0ce">PIUI connects to your locally installed PI process, so it cannot run directly from a <code>file://</code> page.</p>
          <p style="margin:0;color:#dbe1ea">Double-click <strong>Start PIUI.command</strong> in this folder, then open the address shown in Terminal.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
