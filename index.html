<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>PIUI</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === "file:") {
        document.documentElement.style.background = "#11100f";
        document.documentElement.style.color = "#f4efe8";
        document.getElementById("root").innerHTML = `
          <main style="max-width:680px;margin:12vh auto;padding:32px;font:16px/1.6 ui-sans-serif,system-ui,sans-serif">
            <p style="color:#db9f67;text-transform:uppercase;letter-spacing:.12em;font-size:12px">PIUI launcher</p>
            <h1 style="font-size:36px;line-height:1.15;margin:8px 0 16px">PIUI needs its local server</h1>
            <p style="color:#bdb7ae">The browser cannot run PIUI directly from <code>file://</code> because the interface connects to the locally installed PI agent.</p>
            <p>Double-click <strong>Start PIUI.command</strong> in this folder, or run:</p>
            <pre style="padding:16px;border:1px solid #393633;border-radius:10px;background:#191817;overflow:auto"><code>npm run build\nnpm start</code></pre>
            <p>Once it is running, open <a href="http://127.0.0.1:31415" style="color:#f0ad72">http://127.0.0.1:31415</a>.</p>
          </main>`;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
